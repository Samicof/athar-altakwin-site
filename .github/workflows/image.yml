name: verify-and-publish-image
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check pages and links
        run: python3 scripts/check_site.py
      - name: Build the deployment image
        run: docker build -t athar-site-check .
      - name: Smoke test the image
        run: |
          docker run -d --name athar-site-check -p 127.0.0.1:18080:80 athar-site-check
          for i in $(seq 1 15); do curl -fsS http://127.0.0.1:18080/ >/dev/null && break || sleep 1; done
          curl -fsS http://127.0.0.1:18080/ >/dev/null
          curl -fsS http://127.0.0.1:18080/en/ >/dev/null
          curl -fsS http://127.0.0.1:18080/privacy/ >/dev/null
          curl -fsS http://127.0.0.1:18080/en/privacy/ >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: www.athrtk.com' http://127.0.0.1:18080/)" = 301
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/missing-page)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/en/missing-page)" = 404

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish a commit-tagged image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # :latest is what the my-stacks compose tracks (push here, owner presses Deploy in Dockhand);
          # sha-<commit> stays for rollback by pinning the compose to a known build.
          tags: |
            ghcr.io/samicof/athar-altakwin-site:latest
            ghcr.io/samicof/athar-altakwin-site:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Samicof/athar-altakwin-site
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
